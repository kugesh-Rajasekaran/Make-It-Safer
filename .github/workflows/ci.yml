name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Format check, lint and unit tests on every push.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26.x: go.mod says 1.26.0, which would pin the oldest patch release.
          go-version: '1.26'
          check-latest: true
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
      - run: make check
      # Fails when the code calls a vulnerable function in the standard library
      # or a dependency (so a new Go patch release shows up here first).
      - name: Check for known vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  # Throwaway Ubuntu and Debian SSH servers in Docker.
  integration:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26.x: go.mod says 1.26.0, which would pin the oldest patch release.
          go-version: '1.26'
          check-latest: true
      - run: make test-integration

  # macOS minutes cost more on private repos, so this runs on pull requests only.
  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26.x: go.mod says 1.26.0, which would pin the oldest patch release.
          go-version: '1.26'
          check-latest: true
      - run: go build ./... && go vet ./... && go test ./...
      - name: Build the notification helper app
        run: make macos-helper
