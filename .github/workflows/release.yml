name: release

# Pushing a tag like v0.1.0 builds mis for macOS and Linux and publishes a
# GitHub Release with the archives and checksums.txt. install.sh downloads
# from there. A tag with a hyphen (v0.2.0-rc1) becomes a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Nothing is built or published unless the tagged commit passes the same
  # checks as every push, and the code calls no known-vulnerable function.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
      - run: make check
      - name: Check for known vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" make build VERSION="$TAG"
      - name: Package
        run: |
          mkdir -p stage dist
          cp bin/mis LICENSE README.md stage/
          tar -czf "dist/mis_linux_${ARCH}.tar.gz" -C stage mis LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build the notification helper (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./macos/build.sh
      - name: Build and package
        env:
          # The oldest macOS the notification helper supports (macos/Package.swift).
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" make build VERSION="$TAG"
            otool -l bin/mis | grep -A4 LC_BUILD_VERSION | grep -q 'minos 13.0' || { echo "bin/mis is not built for macOS 13" >&2; exit 1; }
            codesign --force --sign - bin/mis
            rm -rf stage && mkdir stage
            cp bin/mis LICENSE README.md stage/
            cp -R "macos/build/Make-It-Safer Notifier.app" stage/
            tar -czf "dist/mis_darwin_${arch}.tar.gz" -C stage mis LICENSE README.md "Make-It-Safer Notifier.app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/*.tar.gz

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish the release
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes $pre
